<svg
  class="official-school-logo"
  viewBox="0 0 220 220"
  role="img"
  aria-labelledby="schoolLogoTitle schoolLogoDesc"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="schoolLogoTitle">
    PRO-MAX Académie Real Estate School
  </title>

  <desc id="schoolLogoDesc">
    Official orange and black Real Estate School logo
  </desc>

  <defs>
    <linearGradient
      id="orangeApricot"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#ffb36b"/>
      <stop offset="45%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#c94700"/>
    </linearGradient>

    <radialGradient
      id="blackFade"
      cx="50%"
      cy="42%"
      r="65%"
    >
      <stop offset="0%" stop-color="#2a1307"/>
      <stop offset="60%" stop-color="#0d0703"/>
      <stop offset="100%" stop-color="#030201"/>
    </radialGradient>

    <filter
      id="orangeGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="globeClip">
      <circle cx="110" cy="110" r="76"/>
    </clipPath>
  </defs>

  <!-- BLACK BACKGROUND -->
  <circle
    cx="110"
    cy="110"
    r="105"
    fill="url(#blackFade)"
    stroke="#ff7a00"
    stroke-width="4"
  />

  <!-- OUTER ORBIT -->
  <ellipse
    cx="110"
    cy="110"
    rx="101"
    ry="48"
    fill="none"
    stroke="#ff8a22"
    stroke-width="3"
    transform="rotate(-18 110 110)"
    opacity="0.9"
  />

  <circle
    cx="27"
    cy="83"
    r="6"
    fill="#ffad66"
    filter="url(#orangeGlow)"
  />

  <!-- GLOBE -->
  <circle
    cx="110"
    cy="110"
    r="76"
    fill="#080402"
    stroke="url(#orangeApricot)"
    stroke-width="5"
  />

  <g
    clip-path="url(#globeClip)"
    fill="none"
    stroke="#ff7a00"
    stroke-width="2.5"
    opacity="0.78"
  >
    <ellipse cx="110" cy="110" rx="32" ry="76"/>
    <ellipse cx="110" cy="110" rx="58" ry="76"/>
    <path d="M34 110H186"/>
    <path d="M42 76C78 94 142 94 178 76"/>
    <path d="M42 144C78 126 142 126 178 144"/>
  </g>

  <!-- REAL ESTATE HOUSE -->
  <g
    fill="url(#orangeApricot)"
    stroke="#ff9a3d"
    stroke-linejoin="round"
    filter="url(#orangeGlow)"
  >
    <path
      d="M61 112L110 68L159 112L148 112V157H72V112Z"
      stroke-width="3"
    />

    <path
      d="M91 157V119H129V157Z"
      fill="#090502"
      stroke="#ffad66"
      stroke-width="3"
    />

    <rect
      x="78"
      y="118"
      width="20"
      height="20"
      rx="2"
      fill="#090502"
      stroke="#ffad66"
      stroke-width="2"
    />

    <rect
      x="136"
      y="118"
      width="15"
      height="20"
      rx="2"
      fill="#090502"
      stroke="#ffad66"
      stroke-width="2"
    />
  </g>

  <!-- PM MONOGRAM -->
  <circle
    cx="110"
    cy="110"
    r="18"
    fill="#050301"
    stroke="#ffad66"
    stroke-width="2"
  />

  <text
    x="110"
    y="116"
    fill="#ff8a22"
    text-anchor="middle"
    font-family="Cinzel, Georgia, serif"
    font-size="16"
    font-weight="800"
  >
    PM
  </text>

  <!-- BOTTOM ACCENT -->
  <path
    d="M55 178C85 195 135 195 165 178"
    fill="none"
    stroke="url(#orangeApricot)"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>
