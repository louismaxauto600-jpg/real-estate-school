<!DOCTYPE html>
<html lang="ht" id="htmlRoot" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070402">
  <meta name="google" content="notranslate">

  <title>Course 01 | Real Estate Fundamentals</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    :root {
      --black: #030201;
      --black-soft: #090401;
      --card: #110803;
      --orange: #ff7300;
      --apricot: #ffad66;
      --orange-deep: #b83b00;
      --muted: #d96a22;
      --line: rgba(255, 115, 0, 0.34);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--apricot);
      font-family: "Montserrat", sans-serif;
      background:
        radial-gradient(
          circle at 12% 8%,
          rgba(255, 115, 0, 0.17),
          transparent 27%
        ),
        radial-gradient(
          circle at 90% 63%,
          rgba(184, 59, 0, 0.14),
          transparent 30%
        ),
        var(--black);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.13;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(
        to bottom,
        transparent,
        #000 18%,
        #000 80%,
        transparent
      );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 94px;
      padding: 12px clamp(16px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(3, 2, 1, 0.95);
      backdrop-filter: blur(18px);
    }

    .brand {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 0 15px rgba(255, 115, 0, 0.55));
    }

    .brand-text {
      display: grid;
      gap: 4px;
    }

    .brand-text b {
      color: var(--orange);
      font: 800 1rem "Cinzel", serif;
      letter-spacing: 0.07em;
    }

    .brand-text small {
      font-size: 0.63rem;
      font-weight: 900;
      letter-spacing: 0.17em;
    }

    .brand-text em {
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 0.08em;
    }

    .language-switcher {
      display: flex;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #080401;
    }

    .lang-btn {
      padding: 10px 13px;
      border: 0;
      border-radius: 999px;
      color: var(--orange);
      background: transparent;
      font-size: 0.71rem;
      font-weight: 900;
    }

    .lang-btn.active {
      color: #000;
      background: linear-gradient(
        135deg,
        var(--apricot),
        var(--orange)
      );
    }

    .course-progress-header {
      position: sticky;
      top: 94px;
      z-index: 90;
      padding: 10px clamp(16px, 5vw, 72px);
      border-bottom: 1px solid var(--line);
      background: rgba(9, 4, 1, 0.96);
    }

    .progress-information {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 8px;
      color: var(--orange);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    .progress-track {
      height: 6px;
      overflow: hidden;
      background: #281208;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--orange-deep),
        var(--orange),
        var(--apricot)
      );
      transition: width 0.45s;
    }

    main {
      position: relative;
      z-index: 2;
      width: min(1320px, 92%);
      margin: auto;
      padding: 65px 0 100px;
    }

    .course-hero {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 40px;
      align-items: center;
      padding: clamp(30px, 6vw, 70px);
      border: 1px solid var(--line);
      background:
        linear-gradient(
          130deg,
          rgba(255, 115, 0, 0.15),
          rgba(4, 2, 1, 0.97)
        );
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0;
      color: var(--orange);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .course-hero h1 {
      margin: 15px 0 20px;
      color: var(--apricot);
      font: 800 clamp(2.6rem, 6vw, 5.5rem) / 1 "Cinzel", serif;
    }

    .course-hero p:last-child {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .course-emblem {
      width: 240px;
      height: 240px;
      display: grid;
      place-items: center;
      justify-self: center;
      border: 2px solid var(--orange);
      border-radius: 50%;
      color: #000;
      background:
        radial-gradient(
          circle,
          var(--apricot),
          var(--orange) 60%,
          var(--orange-deep)
        );
      font-size: 6rem;
      box-shadow:
        0 0 45px rgba(255, 115, 0, 0.25),
        inset 0 0 35px rgba(0, 0, 0, 0.25);
    }

    .course-layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 26px;
      align-items: start;
      margin-top: 30px;
    }

    .lesson-navigation {
      position: sticky;
      top: 145px;
      padding: 25px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, #130904, #050201);
      box-shadow: var(--shadow);
    }

      margin: 0 0 20px;
      color: var(--apricot);
      font: 700 1.35rem "Cin
