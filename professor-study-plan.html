<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070301">
  <title>Personalized Study Plan | PRO-MAX Académie</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--orange:#ff7300;--apricot:#ffad66;--dark:#050201;--card:#0d0401;--line:rgba(255,115,0,.32);--muted:#d59672}*{box-sizing:border-box}body{margin:0;color:var(--apricot);background:radial-gradient(circle at 14% 10%,rgba(255,115,0,.18),transparent 28%),linear-gradient(145deg,#020100,#150702 55%,#020100);font-family:Montserrat,sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 5%;border-bottom:1px solid var(--line);background:#030100}.brand{display:flex;align-items:center;gap:13px}.brand img{width:64px;height:64px;object-fit:contain}.brand span{display:grid}.brand b{font:800 1rem Cinzel,serif}.brand small{color:var(--orange);font-weight:900}.actions{display:flex;gap:9px;flex-wrap:wrap}.button{padding:11px 15px;border:1px solid var(--orange);color:var(--orange);background:transparent;font-weight:900;cursor:pointer}.primary{color:#050201;background:var(--orange)}main{width:min(1100px,93%);margin:auto;padding:48px 0 80px}.hero{padding:clamp(28px,6vw,60px);border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,115,0,.14),#050201)}.eyebrow{color:var(--orange);font-weight:900;letter-spacing:.19em}.hero h1{margin:12px 0;font:800 clamp(2rem,5vw,4.2rem) Cinzel,serif}.hero p{max-width:800px;color:var(--muted);line-height:1.7}.student{color:var(--orange)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.summary article{padding:21px;border:1px solid var(--line);background:var(--card)}.summary small{display:block;color:var(--muted);font-weight:800}.summary strong{display:block;margin-top:9px;color:var(--orange);font:800 1.55rem Cinzel,serif}.plan{padding:clamp(24px,5vw,45px);border:1px solid var(--line);background:#080301}.plan h2{margin:0 0 20px;font:700 clamp(1.5rem,4vw,2.5rem) Cinzel,serif}.days{display:grid;gap:13px}.day{display:grid;grid-template-columns:95px 1fr auto;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);background:var(--card)}.day-number{color:var(--orange);font:800 1.2rem Cinzel,serif}.day h3{margin:0 0 6px;font-family:Cinzel,serif}.day p{margin:0;color:var(--muted);line-height:1.5}.day a{padding:10px 13px;border:1px solid var(--orange);color:var(--orange);font-size:.75rem;font-weight:900}.tip{margin-top:22px;padding:20px;border-left:4px solid var(--orange);background:rgba(255,115,0,.08);color:var(--muted);line-height:1.65}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr}.day{grid-template-columns:1fr}.day a{justify-self:start}}@media print{.top,.no-print{display:none!important}body{background:#050201;print-color-adjust:exact;-webkit-print-color-adjust:exact}main{width:100%;padding:0}.hero,.plan{border-color:#ff7300}}
  </style>
</head>
<body><header class="top"><a class="brand" href="index.html"><img src="real-estate-school-logo.png" alt="PRO-MAX Académie"><span><b>PRO-MAX ACADÉMIE</b><small>REAL ESTATE SCHOOL</small></span></a><div class="actions"><a class="button" href="student-dashboard.html" id="back">← DASHBOARD</a><button class="button primary" id="print" type="button">ENPRIME PLAN AN</button></div></header><main><section class="hero"><p class="eyebrow" id="eyebrow">PLAN PÈSONALIZE PWOFESÈ MAX</p><h1 id="title">Plan etid 7 jou pou <span class="student" id="studentName">Etidyan</span></h1><p id="intro">Plan sa a òganize dapre kou ki bezwen plis travay yo. Fè yon sesyon kout chak jou epi verifye pwogrè ou.</p></section><section class="summary"><article><small id="weakLabel">PREMYE PRIYORITE</small><strong id="weakCourse">—</strong></article><article><small id="progressLabel">PWOGRÈ JENERAL</small><strong id="overall">0%</strong></article><article><small id="practiceLabel">DÈNYE NÒT PRATIK</small><strong id="practice">—</strong></article></section><section class="plan"><h2 id="weekTitle">Pwogram semèn nan</h2><div class="days" id="days"></div><div class="tip" id="tip"></div></section></main>
<script>
'use strict';
function read(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch(error){return null}}
const student=read('promaxRealEstateStudent')||{},exam=read('promaxFinalExamResult')||{},practice=read('promaxProfessorPracticeResult')||{};const studentName=String(exam.name||[student.first_name,student.last_name].filter(Boolean).join(' ')||localStorage.getItem('promaxProfessorStudentName')||'Etidyan').trim();
const courses={ht:['Fondasyon byen imobilye','Lwa ak etik pwofesyonèl','Finansman ak ipotèk','Valyasyon pwopriyete','Maketing ak kliyan','Preparasyon egzamen'],en:['Real estate fundamentals','Law and professional ethics','Finance and mortgages','Property valuation','Marketing and clients','Exam preparation'],es:['Fundamentos inmobiliarios','Ley y ética profesional','Financiamiento e hipotecas','Valoración de propiedades','Marketing y clientes','Preparación para el examen']};
const focus={ht:['Revize tè, pwopriyete, tit ak deed.','Revize kontra, divilgasyon ak obligasyon fidisyè.','Pratike enterè, kredi, down payment ak closing costs.','Revize appraisal, comparables ak valè mache.','Pratike listing, kominikasyon ak negosyasyon.','Fè kestyon melanje ak estrateji egzamen.'],en:['Review land, property, title, and deeds.','Review contracts, disclosures, and fiduciary duties.','Practice interest, credit, down payments, and closing costs.','Review appraisals, comparables, and market value.','Practice listings, communication, and negotiation.','Use mixed questions and exam strategy.'],es:['Repase terreno, propiedad, título y escrituras.','Repase contratos, divulgaciones y deberes fiduciarios.','Practique interés, crédito, pago inicial y costos de cierre.','Repase tasaciones, comparables y valor de mercado.','Practique anuncios, comunicación y negociación.','Use preguntas mixtas y estrategia de examen.']};
const words={ht:{back:'← DASHBOARD',print:'ENPRIME PLAN AN',eyebrow:'PLAN PÈSONALIZE PWOFESÈ MAX',title:'Plan etid 7 jou pou',intro:'Plan sa a òganize dapre kou ki bezwen plis travay yo. Fè yon sesyon kout chak jou epi verifye pwogrè ou.',weak:'PREMYE PRIYORITE',progress:'PWOGRÈ JENERAL',practice:'DÈNYE NÒT PRATIK',week:'Pwogram semèn nan',day:'JOU',open:'OUVRI KOU A',practiceDay:'Pratik melanje',practiceText:'Fè Practice Center la epi revize tout repons ki pa kòrèk yo.',openPractice:'OUVRI PRATIK',tip:'Konsèy Pwofesè Max: etidye 25–35 minit pa jou, pran nòt kout, epi poze kestyon lè yon konsèp pa klè.'},en:{back:'← DASHBOARD',print:'PRINT STUDY PLAN',eyebrow:'PROFESSOR MAX PERSONALIZED PLAN',title:'7-day study plan for',intro:'This plan prioritizes the courses that need the most work. Complete one focused session each day and check your progress.',weak:'FIRST PRIORITY',progress:'OVERALL PROGRESS',practice:'LATEST PRACTICE SCORE',week:'Weekly program',day:'DAY',open:'OPEN COURSE',practiceDay:'Mixed practice',practiceText:'Complete the Practice Center and review every incorrect answer.',openPractice:'OPEN PRACTICE',tip:'Professor Max tip: study 25–35 minutes daily, take short notes, and ask questions whenever a concept is unclear.'},es:{back:'← PANEL',print:'IMPRIMIR PLAN',eyebrow:'PLAN PERSONALIZADO DEL PROFESOR MAX',title:'Plan de estudio de 7 días para',intro:'Este plan prioriza los cursos que necesitan más trabajo. Complete una sesión cada día y revise su progreso.',weak:'PRIMERA PRIORIDAD',progress:'PROGRESO GENERAL',practice:'ÚLTIMA NOTA DE PRÁCTICA',week:'Programa semanal',day:'DÍA',open:'ABRIR CURSO',practiceDay:'Práctica combinada',practiceText:'Complete el Centro de Práctica y repase cada respuesta incorrecta.',openPractice:'ABRIR PRÁCTICA',tip:'Consejo del profesor Max: estudie 25–35 minutos diarios, tome notas breves y haga preguntas cuando un concepto no esté claro.'}};
const progress=[];let total=0;for(let number=1;number<=6;number++){const data=read(`promaxCourse0${number}Progress`)||{};let lessons=0;for(let lesson=1;lesson<=6;lesson++)if(data[`lesson${lesson}`])lessons++;total+=lessons;progress.push({number,percent:Math.round(lessons/6*100)})}const priorities=progress.slice().sort((a,b)=>a.percent-b.percent||a.number-b.number);let lang=localStorage.getItem('promaxRealEstateLanguage')||'ht';if(!words[lang])lang='ht';
function render(){const t=words[lang];document.documentElement.lang=lang;document.getElementById('back').textContent=t.back;document.getElementById('print').textContent=t.print;document.getElementById('eyebrow').textContent=t.eyebrow;document.getElementById('title').firstChild.textContent=t.title+' ';document.getElementById('studentName').textContent=studentName;document.getElementById('intro').textContent=t.intro;document.getElementById('weakLabel').textContent=t.weak;document.getElementById('progressLabel').textContent=t.progress;document.getElementById('practiceLabel').textContent=t.practice;document.getElementById('weekTitle').textContent=t.week;document.getElementById('weakCourse').textContent=courses[lang][priorities[0].number-1];document.getElementById('overall').textContent=Math.round(total/36*100)+'%';document.getElementById('practice').textContent=practice.score!=null?practice.score+'%':'—';const days=document.getElementById('days');days.textContent='';for(let day=0;day<7;day++){const card=document.createElement('article');card.className='day';const number=document.createElement('div');number.className='day-number';number.textContent=t.day+' '+(day+1);const content=document.createElement('div');const heading=document.createElement('h3');const paragraph=document.createElement('p');const link=document.createElement('a');if(day===6){heading.textContent=t.practiceDay;paragraph.textContent=t.practiceText;link.href='professor-practice-center.html';link.textContent=t.openPractice}else{const item=priorities[day%6];heading.textContent=String(item.number).padStart(2,'0')+' · '+courses[lang][item.number-1];paragraph.textContent=focus[lang][item.number-1];link.href=`course-0${item.number}.html`;link.textContent=t.open}content.append(heading,paragraph);card.append(number,content,link);days.appendChild(card)}document.getElementById('tip').textContent=t.tip}
document.getElementById('print').addEventListener('click',()=>window.print());render();
</script></body></html>
