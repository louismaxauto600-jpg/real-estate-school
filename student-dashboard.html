<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO-MAX ACADÉMIE - STUDENT AREA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000;
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    color:#FF8C42;
  }
  .page{
    min-height:100vh;
    background: radial-gradient(80% 70% at 50% 100%, #1a0a00 0%, #000 55%, #000 100%);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 28px;
    border-bottom:1px solid rgba(255,107,0,0.12);
    background: rgba(0,0,0,0.6);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px;font-size:14px;color:#FF6B00}
  .dot{width:10px;height:10px;background:#FF6B00;border-radius:50%;box-shadow:0 0 12px #FF6B00}
  .top-right{color:#FF6B00;font-size:11px;letter-spacing:2px;opacity:0.8;display:flex;align-items:center;gap:8px}
  .top-right .live-dot{width:6px;height:6px;background:#00FF88;border-radius:50%;box-shadow:0 0 8px #00FF88}
  
  .center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    text-align:center;
  }
  .label{color:#FF6B00;font-size:13px;letter-spacing:6px;font-weight:700;margin-bottom:18px}
  .title{
    font-size:clamp(42px,9vw,88px);
    font-weight:900;
    line-height:0.9;
    letter-spacing:-2px;
    background: linear-gradient(180deg, #FFD4A8 0%, #FF8C42 30%, #FF6B00 65%, #CC4400 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    filter: drop-shadow(0 0 30px rgba(255,107,0,0.5));
    margin-bottom:22px;
  }
  .subtitle{color:#FFA86B;font-size:clamp(14px,2vw,18px);max-width:560px;line-height:1.5;opacity:0.9}

  /* GLOBE - VRÈ GLOBE ORANGE/BLACK */
  .globe-section{margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:28px}
  .globe-float{animation:floatY 5.2s ease-in-out infinite}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .globe-perspective{perspective:1000px;width:380px;height:380px;display:grid;place-items:center;position:relative}
  .globe-core{
    width:380px;height:380px;border-radius:50%;overflow:hidden;background:#000;position:relative;
    box-shadow:0 0 0 1px rgba(255,107,0,0.35) inset,0 0 28px rgba(255,107,0,0.85),0 0 70px rgba(255,107,0,0.45),0 0 120px rgba(255,69,0,0.28);
  }
  .globe-track{position:absolute;inset:0;display:flex;width:300%;height:100%;animation:globeScroll 20s linear infinite;will-change:transform}
  @keyframes globeScroll{0%{transform:translateX(0)}100%{transform:translateX(-66.666%)}}
  .globe-img{width:33.3333%;height:100%;object-fit:cover;filter:contrast(1.15) brightness(0.95) saturate(1.35)}
  .shade{position:absolute;inset:0;border-radius:50%;pointer-events:none}
  .shade1{background:radial-gradient(85% 85% at 28% 32%, transparent 38%, rgba(0,0,0,0.15) 62%, rgba(0,0,0,0.72) 92%);mix-blend-mode:multiply}
  .shade2{background:radial-gradient(38% 42% at 30% 28%, rgba(255,212,168,0.22) 0%, rgba(255,140,60,0.12) 22%, transparent 62%);mix-blend-mode:screen}
  .glow{position:absolute;inset:-22px;border-radius:50%;background:radial-gradient(60% 60% at 50% 50%, rgba(255,107,0,0.16) 0%, transparent 72%);filter:blur(14px);z-index:-1}

  .pill{
    margin-top:10px;
    padding:12px 26px;
    border-radius:999px;
    background: rgba(20,8,0,0.8);
    border:1px solid rgba(255,107,0,0.25);
    color:#FF6B00;
    font-size:11px;
    letter-spacing:3px;
    font-weight:700;
    backdrop-filter:blur(12px);
    box-shadow:0 0 30px rgba(255,107,0,0.15) inset;
  }

  .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .particles span{position:absolute;width:2px;height:2px;background:#FF6B00;border-radius:50%;opacity:0.6;animation:particleFloat 8s ease-in-out infinite}
  @keyframes particleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
  @media(max-width:768px){.globe-perspective,.globe-core{width:300px;height:300px}}
</style>
</head>
<body>
<div class="page">
  <div class="particles">
    <span style="left:10%;top:30%;animation-delay:0s"></span>
    <span style="left:85%;top:25%;animation-delay:1s"></span>
    <span style="left:70%;top:70%;animation-delay:2s"></span>
    <span style="left:15%;top:75%;animation-delay:3s"></span>
    <span style="left:50%;top:20%;animation-delay:1.5s"></span>
  </div>

  <div class="top-bar">
    <div class="brand"><div class="dot"></div>PRO-MAX ACADÉMIE</div>
    <div class="top-right"><div class="live-dot"></div>ANIMATING • PURE CSS</div>
  </div>

  <div class="center">
    <div class="label">STUDENT AREA</div>
    <h1 class="title">WELCOME,<br>MAX LOUIS</h1>
    <p class="subtitle">Entrez dans l'univers premium<br>de la formation digitale d'élite</p>

    <div class="globe-section">
      <div class="globe-float">
        <div class="globe-perspective">
          <div class="glow"></div>
          <div class="globe-core">
            <div class="globe-track">
              <!-- METE FOTO GLOBE OU A LA -->
              <img class="globe-img" src="GLOBE_ORANGE_BLACK.png" alt="globe">
              <img class="globe-img" src="GLOBE_ORANGE_BLACK.png" alt="globe">
              <img class="globe-img" src="GLOBE_ORANGE_BLACK.png" alt="globe">
            </div>
            <div class="shade shade1"></div>
            <div class="shade shade2"></div>
          </div>
        </div>
      </div>
      <div class="pill">• PRO-MAX ACADÉMIE • GLOBE ANIMÉ 360°</div>
    </div>
  </div>
</div>
</body>
</html>
