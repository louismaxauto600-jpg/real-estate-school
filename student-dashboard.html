<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Area - PRO-MAX ACADEMY</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:radial-gradient(120% 90% at 50% 10%, #1A0F08 0%, #0D0703 25%, #000 100%);min-height:100vh;overflow-x:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid rgba(255,138,61,.12);background:rgba(0,0,0,.75)}
.brand{color:#FF8A3D;font-weight:900;letter-spacing:.15em;font-size:13px;display:flex;gap:8px;align-items:center}
.brand::before{content:'';width:10px;height:10px;border-radius:50%;background:#FF6A00;box-shadow:0 0 12px #FF6A00}
.status{color:#FF8A3D;font-size:11px;letter-spacing:.2em;opacity:.8}
.hero{text-align:center;padding:80px 20px 30px}
.small{color:#FF8A3D;letter-spacing:.4em;font-size:12px;font-weight:600;margin-bottom:22px}
.title{font-weight:900;font-size:clamp(38px,8vw,72px);line-height:.92;background:linear-gradient(180deg,#FFD6B8 0%,#FFB07A 30%,#FF8A3D 60%,#FF6A00 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 32px rgba(255,106,0,.38))}
.subtitle{margin-top:18px;color:#FFB07A;opacity:.85}
.globe-section{display:flex;justify-content:center;padding:40px 20px 80px}
.globe-shell{width:min(80vw,500px);aspect-ratio:1;position:relative;animation:float 6s ease-in-out infinite}
.globe{width:100%;height:100%;border-radius:50%;background-color:#000;background-image:url("https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg/2000px-World_map_-_low_resolution.svg.png");background-size:200% 100%;background-repeat:repeat-x;background-position:0 50%;animation:spin 18s linear infinite;filter:contrast(1.8) brightness(1.3) sepia(1) hue-rotate(-15deg) saturate(3);box-shadow:inset -40px -24px 80px #000,0 0 0 1.5px rgba(255,138,61,.3),0 0 50px rgba(255,106,0,.6),0 0 110px rgba(255,106,0,.32)}
.globe-ring{position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(255,138,61,.28);box-shadow:0 0 42px rgba(255,138,61,.4);pointer-events:none}
.globe-glow{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(255,106,0,.22) 0%,transparent 72%);filter:blur(14px);pointer-events:none}
@keyframes spin{from{background-position:0 50%}to{background-position:-200% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.badge-wrap{text-align:center;padding-bottom:60px}
.badge{display:inline-flex;padding:13px 24px;border-radius:999px;background:rgba(12,7,3,.9);border:1px solid rgba(255,138,61,.32);color:#FF8A3D;font-size:11px;letter-spacing:.22em;font-weight:700}
</style>
</head>
<body>
<div class="topbar"><div class="brand">PRO-MAX ACADEMY</div><div class="status">CLEAR CONTINENTS</div></div>
<div class="hero"><div class="small">STUDENT AREA</div><div class="title">WELCOME,<br>MAX LOUIS</div><div class="subtitle">Enter the premium world of elite digital training</div></div>
<div class="globe-section"><div class="globe-shell"><div class="globe-glow"></div><div class="globe"></div><div class="globe-ring"></div></div></div>
<div class="badge-wrap"><div class="badge">• PRO-MAX ACADEMY • CLEAR CONTINENTS GLOBE •</div></div>
</body>
</html>
