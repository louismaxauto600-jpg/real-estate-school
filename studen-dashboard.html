<!DOCTYPE html>  <html lang="ht">  
<head>  
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">  
<meta name="theme-color" content="#070402">  
<title>Student Dashboard - GLOBE ANIME FIXED</title>  
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">  
<style>  
:root{--orange:#ff7300;--apricot:#ffb067;--black:#050201;--muted:#d99768;--line:rgba(255,115,0,.3)}  
*{box-sizing:border-box}  
body{margin:0;min-height:100vh;color:var(--apricot);background:radial-gradient(circle at 80% 4%,rgba(255,115,0,.18),transparent 25%),linear-gradient(145deg,#150702,#020100 55%,#0c0301);font-family:Montserrat,sans-serif;overflow-x:hidden}  
.header{display:flex;justify-content:space-between;align-items:center;padding:13px 5%;border-bottom:1px solid var(--line);background:rgba(5,2,1,.97);position:sticky;top:0;z-index:100}  
.brand{display:flex;gap:12px;align-items:center}  
.brand img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 0 15px rgba(255,115,0,.55))}  
.brand span{display:grid;gap:4px}  
.brand b{color:var(--orange);font:800 1rem Cinzel,serif}  
.brand small{color:var(--apricot);font-weight:900;letter-spacing:.12em}  
main{width:min(1250px,93%);margin:auto;padding:40px 0 90px}  
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;padding:50px 40px;border:1px solid rgba(255,115,0,.55);background:radial-gradient(circle at 82% 50%,rgba(255,115,0,.27),transparent 33%),linear-gradient(120deg,rgba(37,12,2,.98),rgba(3,1,0,.98) 68%);position:relative;overflow:hidden}  
.hero h1{font:800 clamp(2.5rem,5vw,4rem) Cinzel,serif;color:var(--apricot);margin:10px 0}  
.hero h1 span{color:var(--orange)}  
.hero p{color:var(--muted);line-height:1.7;max-width:600px}  
/* ⭐ RANJMAN 1: Ajoute perspective pou 3D a mache */  
.globe-wrap{position:relative;width:340px;height:340px;justify-self:center;display:grid;place-items:center;perspective:1000px;transform-style:preserve-3d}  
/* ⭐ RANJMAN 2: Float sou wrapper apa */  
.globe-float{width:100%;height:100%;display:grid;place-items:center;animation:globeFloat 4s ease-in-out infinite;transform-style:preserve-3d}  
.globe-glow{position:absolute;inset:-20px;background:radial-gradient(circle,rgba(255,115,0,.35),transparent 70%);border-radius:50%;filter:blur(20px);animation:glowPulse 3s ease-in-out infinite}  
.globe-img{position:relative;z-index:3;width:100%;height:100%;object-fit:contain;transform-origin:center center;filter:drop-shadow(0 0 40px rgba(255,115,0,.9));animation:globeSpin 18s linear infinite;transform-style:preserve-3d;will-change:transform}  
.globe-ring{position:absolute;inset:5%;border:1px solid rgba(255,115,0,.5);border-radius:50%;animation:ringSpin 12s linear infinite}  
.globe-ring2{position:absolute;inset:18%;border:1px dashed rgba(255,115,0,.3);border-radius:50%;transform:rotateX(70deg);animation:ringSpin2 8s linear infinite}  
.globe-label{position:absolute;z-index:5;bottom:-18px;left:50%;transform:translateX(-50%);padding:8px 14px;border:1px solid var(--orange);background:rgba(5,2,1,.95);color:var(--orange);font-size:.6rem;font-weight:900;white-space:nowrap}  
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}  
.stat{padding:22px;border:1px solid var(--line);background:#0d0401}  
.stat i{color:var(--orange)}  
.stat strong{display:block;color:var(--orange);font:800 2rem Cinzel,serif;margin:10px 0 5px}  
.stat span{color:var(--muted);font-size:.7rem;font-weight:800}  
@keyframes globeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}  
@keyframes globeSpin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}  
@keyframes glowPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}  
@keyframes ringSpin{to{transform:rotate(360deg)}}  
@keyframes ringSpin2{from{transform:rotateX(70deg) rotate(0deg)}to{transform:rotateX(70deg) rotate(360deg)}}  
@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}.hero p{margin-left:auto;margin-right:auto}.globe-wrap{width:260px;height:260px;margin:20px auto}.stats{grid-template-columns:1fr 1fr}}  
</style>  
</head>  
<body>  
<header class="header">  
<div class="brand">  
<img src="./real-estate-school-logo.png" alt="PRO-MAX" onerror="this.src='https://github.com/louismaxauto600-jpg/real-estate-school/raw/refs/heads/main/real-estate-school-logo.png'">  
<span><b>PRO-MAX ACADÉMIE</b><small>REAL ESTATE SCHOOL</small></span>  
</div>  
</header>  
<main>  
<section class="hero">  
<div>  
<p style="color:var(--orange);font-weight:900;letter-spacing:.18em;font-size:.7rem">STUDENT AREA</p>  
<h1>WELCOME, <span>MAX LOUIS</span></h1>  
<p>Track your courses, exam score and certificate in one place.</p>  
</div>  
<div class="globe-wrap">  
<div class="globe-glow"></div>  
<div class="globe-ring"></div>  
<div class="globe-ring2"></div>  
<!-- ⭐ RANJMAN 3: Float apa, Spin apa pou pa konfli -->  
<div class="globe-float">  
<img  
class="globe-img"  
src="./promax-new-globe-transparent.png"  
alt="PRO-MAX Académie animated globe"  
onerror="this.onerror=null;this.src='./globe-orange-black.png';this.onerror=null;this.src='https://github.com/louismaxauto600-jpg/real-estate-school/raw/refs/heads/main/promax-new-globe-transparent.png';"  
>  
</div>  
<div class="globe-label">PRO-MAX ACADÉMIE • GLOBE ANIME 360°</div>  
</div>  
</section>  
<section class="stats">  
<div class="stat"><i class="fa-solid fa-book-open"></i><strong>0/6</strong><span>COMPLETED COURSES</span></div>  
<div class="stat"><i class="fa-solid fa-list-check"></i><strong>3%</strong><span>LESSON PROGRESS</span></div>  
<div class="stat"><i class="fa-solid fa-file-circle-check"></i><strong>90%</strong><span>FINAL EXAM</span></div>  
<div class="stat"><i class="fa-solid fa-award"></i><strong>OK</strong><span>CERTIFICATE</span></div>  
</section>  
</main>  
</body>  
</html>
